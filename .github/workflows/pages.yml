# Publishes Website/ (and only Website/) to rescriva.com with GitHub Pages.
# Settings → Pages → Build and deployment → Source must be "GitHub Actions".
# The custom domain is set on that same page; a CNAME file isn't used by this kind of deploy.
name: Website

on:
  push:
    branches: [main]
    paths:
      - "Website/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push waits rather than cancelling one halfway through.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: Website
      - id: deployment
        uses: actions/deploy-pages@v4
